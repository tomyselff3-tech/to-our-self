version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: to-our-self-db
    environment:
      POSTGRES_USER: to_our_self
      POSTGRES_PASSWORD: password
      POSTGRES_DB: to_our_self_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U to_our_self']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: to-our-self-cache
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: to-our-self-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://to_our_self:password@postgres:5432/to_our_self_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages:/app/packages
    command: pnpm --filter api dev

volumes:
  postgres_data:
  redis_data:
